<!doctype html>

    <div id="container">
      <header class="header">

            <button id="js-hamburger" class="hamburger sp">
              <span></span>

              <ul class="header-nav__items">

                </li>
                <li class="header-nav__item">
                  <a href="#service">SERVICE</a>
                </li>
                <li class="header-nav__item">
                  <a href="#works">WORKS</a>
                </li>
                <li class="header-nav__item">
                  <a href="#news">NEWS</a>
                </li>
                <li class="header-nav__item">

              </ul>

      <!-- fv -->
      <main>
      <div class="fv">
        <div class="fv-content">
        <div class="fv-image">
          <picture>
          <source
            media="(min-width:768px)"
            srcset="images/FirstView_01_pc.jpg"
          />
          <img
            src="images/SP_FirstView-1.jpg"
            alt="永遠も。瞬間も。あなたと共に。"
          />

        </div>

          </div>
        </div>
      </div>

        <div class="about-content">
          <div class="about-image">
            <picture>
              <source media="(min-width: 768px)" srcset="images/About.jpg">
              <img src="images/About_SP.jpg" alt="伝統とイマを繋ぐ">
            </picture>
          </div>
          <div class="about-text">
            <div class="about-text-title">
              <p>伝統とイマを繋ぐ</p>
            </div>
            <div class="about-text-desc">
              <p>古来から伝わる伝統文化<br>昔からそこにある材料<br>その土地に長い間かけて<br>最適化してきた<br>たくさんのヒントを<br>イマを生きる私たちの<br>心地よさに取り入れ<br>新たな技術革新を<br>起こし続ける会社です</p>
            </div>
          </div>
        </div>
